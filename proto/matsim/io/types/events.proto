syntax = "proto3";

package matsim.io.types;

import "matsim/io/types/general.proto";

option java_multiple_files = true;
option java_package = "org.matsim.schemas.io.types";
option java_outer_classname = "EventsProto";

message TimeStep {
  // Simulation clock instant in nanoseconds since simulation start.
  uint64 time_ns = 1;
  bytes data = 2;
}

message GenericEvent {
  string type = 1;
  map<string, AttributeValue> attributes = 2;
}
